name: CI

on:
  push:
    branches: [main, develop, integration/sales-v7]
  pull_request:
    branches: [main, develop, integration/sales-v7]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Sales stack smoke (no API keys)
        run: bash scripts/smoke-ci.sh
