name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wire2_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      
      - name: Generate Prisma Client
        working-directory: backend
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/wire2_test
      
      - name: Run migrations
        working-directory: backend
        run: npm run db:migrate:deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/wire2_test
      
      - name: Run tests
        working-directory: backend
        run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/wire2_test
          SIGNING_PRIVATE_KEY: dGVzdF9wcml2YXRlX2tleV8zMl9ieXRlc19mb3JfZGV2X3Rlc3RpbmdfcHVycG9zZXNfb25seQ==
          SIGNING_PUBLIC_KEY: dGVzdF9wdWJsaWNfa2V5XzMyX2J5dGVzX2Zvcl9kZXZfdGVzdGluZw==
          STORAGE_TYPE: local
          NODE_ENV: test
      
      - name: Validate OpenAPI spec
        working-directory: backend
        run: npm run openapi:validate
      
      - name: Run contract tests
        working-directory: backend
        run: npm run openapi:contract-tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/wire2_test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      
      - name: Generate Prisma Client
        working-directory: backend
        run: npm run prisma:generate
      
      - name: Build
        working-directory: backend
        run: npm run build
      
      - name: Build Docker image
        working-directory: .
        run: |
          docker build -t wire2-backend:test -f backend/Dockerfile backend/
        continue-on-error: true
