version: '3.8'

# Development docker-compose configuration
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  # PostgreSQL Database (development)
  postgres:
    image: postgres:15-alpine
    container_name: wire2-postgres-dev
    environment:
      POSTGRES_DB: wire2
      POSTGRES_USER: wire2_user
      POSTGRES_PASSWORD: wire2_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wire2_user -d wire2"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wire2-network-dev

  # Single WIRE backend (development mode)
  wire-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wire2-backend-dev
    environment:
      NODE_ENV: development
      PORT: 8000
      DATABASE_URL: postgresql://wire2_user:wire2_password@postgres:5432/wire2?schema=public
      # Demo mode enabled for development
      AUTH_MODE: demo
      CORS_ORIGIN: "*"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run db:migrate:deploy && npm run db:seed && npm run dev"
    volumes:
      # Mount source for hot reload in dev
      - ./backend/src:/app/src:ro
      - ./backend/prisma:/app/prisma:ro
    networks:
      - wire2-network-dev
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data_dev:

networks:
  wire2-network-dev:
    driver: bridge
