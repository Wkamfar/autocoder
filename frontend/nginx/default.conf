server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index-wire.html;

    # Canonical base: /v2 (frontend router basename + Vite base).
    # Supported alias: /wire/* -> /v2/*

    # Root goes to canonical app base.
    location = / {
        return 308 /v2/;
    }

    # /wire alias (customer-facing compatibility)
    location = /wire {
        return 308 /v2/;
    }
    location ~ ^/wire/(.*)$ {
        return 308 /v2/$1;
    }

    # Canonicalize /v2 -> /v2/
    location = /v2 {
        return 308 /v2/;
    }

    # Cache static assets under /v2/* (the build emits /v2/assets/* etc)
    location ^~ /v2/assets/ {
        rewrite ^/v2/(.*)$ /$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ^~ /v2/fonts/ {
        rewrite ^/v2/(.*)$ /$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ^~ /v2/images/ {
        rewrite ^/v2/(.*)$ /$1 break;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location ^~ /v2/resources/ {
        rewrite ^/v2/(.*)$ /$1 break;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location ^~ /v2/brand/ {
        rewrite ^/v2/(.*)$ /$1 break;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA routing under /v2/*
    location ^~ /v2/ {
        rewrite ^/v2/(.*)$ /$1 break;
        try_files $uri $uri/ /index-wire.html;
    }
}

